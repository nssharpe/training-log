<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Training Log</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<header id="app-header">
  <div class="brand">Training Log</div>
  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="mobility" role="tab">Mobility</button>
    <button class="tab" data-tab="strength" role="tab">Strength</button>
    <button class="tab" data-tab="history" role="tab">History</button>
  </nav>
  <div class="header-right">
    <span id="save-indicator" class="save-indicator" aria-live="polite"></span>
    <button id="reconnect-btn" class="reconnect-btn" hidden>Reconnect</button>
    <button id="tips-btn" class="pill ghost" title="Warmup &amp; training tips">📖</button>
  </div>
</header>

<main id="app-main"></main>

<!-- Rest timer overlay -->
<div id="timer-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-title">Rest</div>
    <div id="timer-display" class="timer-display">00:60</div>
    <div class="overlay-actions">
      <button id="timer-sub-30">−30s</button>
      <button id="timer-add-30">+30s</button>
      <button id="timer-stop" class="primary">Stop</button>
    </div>
  </div>
</div>

<!-- Metronome overlay -->
<div id="metronome-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-title">Metronome</div>
    <div class="metronome-row">
      <label>BPM <input id="bpm-input" type="number" min="20" max="240" value="60"></label>
      <button id="bpm-60">60</button>
      <button id="bpm-90">90</button>
      <button id="bpm-120">120</button>
    </div>
    <div class="overlay-actions">
      <button id="metro-toggle" class="primary">Start</button>
      <button id="metro-close">Close</button>
    </div>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
